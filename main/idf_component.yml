dependencies:
  idf:
    version: ">=5.4.2"

  # Everything that is not MP3. Ships as precompiled archives under the
  # ESPRESSIF MIT licence -- free, but licensed for use on Espressif
  # silicon only, which is the same caveat the exFAT note carries. P4 has
  # been supported since v2.0.0.
  espressif/esp_audio_codec: "^2.3.0"

  # TJpgDec, as the software JPEG fallback for covers the hardware
  # decoder cannot allocate for. The P4's decoder has no scaler --
  # jpeg_decode_cfg_t carries a format, a byte order and a colour
  # standard and nothing else -- so a 3000 px cover wants 17.3 MB in one
  # block and does not get it. TJpgDec decodes at 1/2, 1/4 or 1/8.
  #
  # Not in ROM on this chip: the ROM copy exists on ESP32, S3, C3, C6, C5
  # and C61 and the P4 is not among them, so this is about 5 KB of flash.
  # Reached only where the hardware path has already failed.
  #
  # TJpgDec is ChaN's, under its own permissive licence -- the notice has
  # to travel with a redistribution. See README.
  espressif/esp_jpeg: "^1.3.1"

  espressif/esp_lcd_st7121: "^1.0.0"

  # USB mass storage host, for the flash-drive tab in the chooser. The IDF
  # tree carries the host stack itself (the `usb` component); this is the
  # class driver on top of it, and it lives in the registry rather than in
  # IDF.
  espressif/usb_host_msc: "^1.1.0"

  # USB audio host, for the UAC output path. Same story as the MSC driver
  # above: the host stack is in IDF, this is the class driver on top of
  # it. Both sit on the one bus that usbhost.c owns.
  espressif/usb_host_uac: "^1.5.0"

  # Both, because the controller is probed rather than assumed: rev 1 Tab5
  # is ILI9881C + GT911, rev 2 is ST7121/ST7123 + ST7123. Dropping the one
  # your board does not have saves a little flash and guarantees the other
  # revision fails at runtime instead of at link time.
  # The radio, which is an ESP32-C6 on the other end of SDIO2. The P4 has
  # none of its own. esp_wifi_remote makes the C6 look like a local
  # esp_wifi; esp_hosted is the transport underneath it.
  #
  # esp_wifi_remote is DELIBERATELY UNPINNED, following usb_host_msc's
  # reasoning: a guessed pin that the registry cannot satisfy stops the
  # project configuring entirely. It follows whatever esp_hosted allows.
  #
  # esp_hosted IS PINNED, and the floor is not caution. 3.0.2 is the
  # release that added per-board presets with M5Stack Tab5 among them, and
  # sdkconfig.defaults selects that preset (CONFIG_ESP32P4_TAB5_C6_BOARD)
  # and sets the reset line through Kconfig, which is the one pin wifi.c
  # cannot set from code -- see the note on CONFIG_ESP_HOSTED_HOST_RESET_GPIO
  # there. Everything in wifi.c has only ever been built and run against
  # 3.x.
  #
  # NO OLDER FALLBACK. This comment used to offer esp_hosted 1.4.0 with
  # esp_wifi_remote 0.8.5, a pairing from BufferRoot/M5STACK-TAB5-DEMO-CLEAN,
  # as known-good. The pin below excludes it, and nothing in this tree has
  # been built against it since the pin went in. If a newer release breaks
  # the radio, pin back to the last pair that worked, which
  # dependencies.lock records -- esp_hosted 3.0.7 with esp_wifi_remote
  # 1.6.4 when this was written -- not to a 1.x.
  #
  # The M5 slave firmware reports no version, so esp_hosted 3.0.7 logs
  #   E eh_init_evt: major version mismatch — OTA coprocessor from host
  # at every radio start, and works anyway: scan, APSTA, join and NTP all
  # ran on hardware with that line printed above them. It is upstream's
  # advice, not a fault. DO NOT act on it without a reason: an OTA would
  # replace M5's C6 firmware with a stock slave build, which has never been
  # tried on this board, and this tree has nothing that writes one.
  #
  # NOTHING TO SELECT IN MENUCONFIG. sdkconfig.defaults selects the board
  # and sets reset GPIO 15 and its polarity; wifi.c sets the data pins
  # (CLK 12, CMD 13, D0 11, D1 10, D2 9, D3 8) and logs the struct the
  # driver actually copied as "SDIO in use", which is the line to believe
  # -- eh_sdio's own banner prints build-time defaults. A build that logs
  # the P4-Function-EV-Board pins instead (CLK 18, CMD 19, D0-D3 14-17,
  # reset 54) is using an sdkconfig generated before those defaults
  # existed: sdkconfig.defaults does not override an existing sdkconfig,
  # so `rm sdkconfig` and build. `idf.py fullclean` empties build/ only and
  # would leave the stale sdkconfig in place.
  espressif/esp_wifi_remote: "*"
  espressif/esp_hosted: ">=3.0.2"

  espressif/esp_lcd_touch_st7123: "*"
  espressif/esp_lcd_touch_gt911: "*"

# minimp3 is NOT here. It is two headers with no component manifest
# upstream, so it is vendored by tools/fetch_vendored.sh into
# components/minimp3/ and committed. See README.
