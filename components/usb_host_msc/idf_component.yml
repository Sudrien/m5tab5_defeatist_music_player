## IDF Component Manager Manifest File
version: "1.3.0"
description: USB Host MSC driver
url: https://github.com/espressif/esp-usb/tree/master/host/class/msc/usb_host_msc
issues: "https://github.com/espressif/esp-usb/issues"
repository: "https://github.com/espressif/esp-usb.git"
repository_info:
  path: "host/class/msc/usb_host_msc"
dependencies:
  idf: ">=5.0"
  # Upstream's `usb` dependency applies only from IDF 6.0 and points into
  # the esp-usb tree; on IDF 5.5 CMakeLists.txt requires IDF's own `usb`.
  # Dropped from this vendored copy, as in components/usb_host_uac (5025).
targets:
  - esp32s2
  - esp32s3
  - esp32p4
  - esp32h4
  - esp32s31
  - linux
files:
  exclude:
    - "test_app"
    - "host_test"
