name: Build and Artifact the ESP-IDF Project

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git tag, branch, or commit to build (e.g. v0.1.0)'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Run exFAT Setup Script
        run: |
          chmod +x tools/enable_exfat.sh
          ./tools/enable_exfat.sh

      - name: Run vendored Setup Script
        run: |
          chmod +x tools/fetch_vendored.sh
          ./tools/fetch_vendored.sh
          
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v5.5.5"
          target: 'esp32p4'

      - name: Build and Merge Binaries
        run: |
          idf.py set-target esp32p4
          idf.py build
          idf.py merge-bin
          mv build/merged-binary.bin build/m5tab5_defeatist_music_player_${{ github.ref_name }}_standalone.bin

      - name: Archive build output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m5tab5_defeatist_music_player-${{ github.ref_name }}
          path: |
            build/m5tab5_defeatist_music_player_${{ github.ref_name }}_standalone.bin
            build/m5tab5_defeatist_music_player.bin
